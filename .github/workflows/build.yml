name: Build TaskBus

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  taskbus-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test TaskBus protocol and worker state
        run: dotnet test TaskBus.Tests/TaskBus.Tests.csproj -c Release --nologo

      - name: Test Radar protocol
        run: dotnet test tests/Radar.Tests/Radar.Tests.csproj -c Release --nologo

  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Space Engineers Dedicated Server
        shell: pwsh
        run: |
          $steam = Join-Path $env:RUNNER_TEMP steamcmd
          $server = Join-Path $env:RUNNER_TEMP se-server
          $zip = Join-Path $env:RUNNER_TEMP steamcmd.zip
          New-Item -ItemType Directory -Force build/logs | Out-Null
          Invoke-WebRequest https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip -OutFile $zip
          Expand-Archive $zip -DestinationPath $steam
          $exe = Join-Path $steam steamcmd.exe
          $bin = Join-Path $server DedicatedServer64
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            "SteamCMD installation attempt $attempt" | Tee-Object -FilePath build/logs/steamcmd.log -Append
            & $exe '+@sSteamCmdForcePlatformType' windows '+@sSteamCmdForcePlatformBitness' 64 `
              +force_install_dir $server +login anonymous +app_info_update 1 +app_info_print 298740 `
              +app_update 298740 validate +quit |
              Tee-Object -FilePath build/logs/steamcmd.log -Append
            if ($LASTEXITCODE -eq 0 -and (Test-Path (Join-Path $bin Sandbox.Common.dll))) { break }
            if ($attempt -eq 3) { throw "SteamCMD failed to install app 298740 (exit code $LASTEXITCODE)." }
            Start-Sleep -Seconds (5 * $attempt)
          }

          $manifest = Join-Path $server steamapps/appmanifest_298740.acf
          if (Test-Path $manifest) {
            Select-String -Path $manifest -Pattern '"buildid"' | ForEach-Object { $_.Line.Trim() } |
              Tee-Object -FilePath build/logs/game-versions.log -Append
          }
          $libraries = @(
            'Sandbox.Common', 'Sandbox.Game', 'SpaceEngineers.Game',
            'SpaceEngineers.ObjectBuilders', 'VRage', 'VRage.Game',
            'VRage.Library', 'VRage.Math'
          )
          foreach ($library in $libraries) {
            $dll = Join-Path $bin "$library.dll"
            if (!(Test-Path -LiteralPath $dll -PathType Leaf)) {
              throw "Required game assembly is missing: $dll"
            }
            $file = Get-Item -LiteralPath $dll
            "$library assembly=$([Reflection.AssemblyName]::GetAssemblyName($dll).Version) file=$($file.VersionInfo.FileVersion)" |
              Tee-Object -FilePath build/logs/game-versions.log -Append
          }
          "SPACE_ENGINEERS_BIN64=$bin" >> $env:GITHUB_ENV

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          dotnet --info | tee build/logs/dotnet.log
          bash build.sh 2>&1 | tee build/logs/build.log

      - name: Upload validated build and results
        uses: actions/upload-artifact@v4
        with:
          name: taskbus-build
          path: |
            build/logs/
            build/test-results/*.trx
            build/output/libs/igc-core/igc-core/TaskBus.IgcCore.dll
            build/output/libs/taskbus-consumer/taskbus-consumer/TaskBus.Consumer.dll
            build/output/libs/taskbus-producer/taskbus-producer/TaskBus.Producer.dll
            build/output/services/broker/broker/TaskBroker.dll
            build/output/services/consumer/consumer/TaskConsumer.dll
            build/output/services/producer/producer/TaskProducer.dll
            build/output/apps/amn/amn/AMN.Base.dll
            build/output/apps/fcs/fcs/FlightControl.dll
            build/output/**/*.pb.cs
            build/output/apps/sample/sample/SampleMain.dll
            build/output/apps/ship-link/ship-link/ShipLink.dll
            build/output/TaskBus.Tests/TaskBus.Tests/TaskBus.Tests.dll
            build/output/apps/radar/radar/Radar.dll

      - name: Upload failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: taskbus-build-diagnostics
          path: |
            build/logs/
            build/test-results/*.trx
